# Calidad en cada push, en Linux y en un par de minutos (el instalador lo sigue haciendo compilar.yml, con etiqueta).
#   1. ruff con las reglas de errores graves (sintaxis, nombres sin definir), igual que el QA local.
#   2. pytest sin pantalla con lo que las pruebas importan y no es de Windows: PyQt6, pytest-qt, requests,
#      pandas, openpyxl y selenium, con las versiones fijadas en requirements*.txt (msal y
#      PyInstaller se quedan fuera: no las importa ninguna prueba).
name: Calidad

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calidad:
    name: ruff y pytest (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: ruff
        run: |
          python -m pip install ruff==0.14.0
          ruff check --no-cache --select E9,F63,F7,F82 src main.py tests config

      - name: Bibliotecas del sistema para Qt sin pantalla
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Dependencias de las pruebas (sin las de Windows)
        run: |
          paquetes='PyQt6|PyQt6-Qt6|requests|urllib3|certifi|idna|charset-normalizer|pandas|numpy|python-dateutil|pytz|tzdata|six|openpyxl|et_xmlfile|selenium|trio|trio-websocket|outcome|attrs|sniffio|sortedcontainers|wsproto|h11|PySocks|websocket-client|typing_extensions'
          grep -E "^($paquetes)==" requirements.txt > "$RUNNER_TEMP/linux.txt"
          grep -E '^(pytest|pytest-qt)==' requirements-dev.txt >> "$RUNNER_TEMP/linux.txt"
          cat "$RUNNER_TEMP/linux.txt"
          python -m pip install -r "$RUNNER_TEMP/linux.txt"

      - name: pytest
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
