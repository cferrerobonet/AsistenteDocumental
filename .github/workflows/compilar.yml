# Compila siempre en GitHub, para Windows y para macOS. No se compila nunca en local.
#
#   • Al publicar una etiqueta vX.Y.Z: en cada sistema, pruebas, driver de Edge,
#     PyInstaller, comprobación de que no lleva datos y prueba de arranque; luego el
#     instalador de Windows (Inno Setup) y el DMG de macOS se adjuntan al release
#     de esa etiqueta (lo crea si no existe).
#   • A mano, desde la pestaña Actions: lo mismo, pero deja el instalador y el DMG
#     como artefactos de la ejecución y no publica nada.
#
# El msedgedriver no se versiona: scripts/descargar_driver.py baja el estable de cada
# sistema y va dentro del instalador y del .app, para que la app arranque sin red.
name: Compilar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13"
  # Nombre visible (NOMBRE_APP de src/__init__.py, sin «_»): el .app, el volumen del DMG,
  # la descripción del exe y el título del release. El exe y el ejecutable de dentro del
  # .app conservan el nombre interno, y los adjuntos del release el que busca el actualizador.
  NOMBRE: Asistente Documentación EPLA
  EXE: dist/Asistente_Documentacion_EPLA/Asistente_Documentacion_EPLA.exe
  APP: dist/Asistente Documentación EPLA.app
  # Sin __pycache__ dentro de src/: PyInstaller copia esa carpeta tal cual.
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  windows:
    name: Instalador de Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Unitarias y de interfaz (pytest-qt, sin pantalla): ventana principal,
      # actualizador, novedades y el arranque completo en modo prueba.
      - name: Pruebas
        env:
          PYTHONPATH: ${{ github.workspace }}
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v

      # La versión vive solo en src/__init__.py (__version__); con etiqueta, tiene que coincidir.
      - name: Versión
        id: version
        shell: bash
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/__init__.py | head -1)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "[ERROR] src/__init__.py dice $v y la etiqueta ${GITHUB_REF_NAME}"; exit 1
          fi
          echo "Versión: $v"
          echo "numero=$v" >> "$GITHUB_OUTPUT"

      - name: Bajar el msedgedriver de Windows
        run: python scripts/descargar_driver.py

      - name: Compilar el exe con PyInstaller
        run: pyinstaller Asistente_Documentacion_EPLA.spec --noconfirm --clean

      - name: Comprobar que el exe existe y no lleva datos
        shell: pwsh
        run: |
          if (-not (Test-Path $env:EXE)) { Write-Host "[ERROR] No existe $env:EXE"; exit 1 }
          # Lo propio de la app (raíz, _internal y las carpetas que copia el spec) solo
          # puede llevar código, imágenes y el driver; en todo dist, ni .env ni la
          # configuración de otras variantes.
          $raiz = Split-Path $env:EXE
          $int = Join-Path $raiz "_internal"
          $propios = @(Get-ChildItem $raiz, $int -File -Force) +
            @(Get-ChildItem (Join-Path $int "config"), (Join-Path $int "src"), (Join-Path $int "imagenes"), (Join-Path $int "drivers") -Recurse -File -Force)
          # La licencia OFL de las tipografías Barlow (src/recursos/fuentes) sí viaja con ellas.
          $prohibidos = @($propios | Where-Object {
            ($_.Extension -in ".xlsx", ".xls", ".csv", ".db", ".sqlite", ".log", ".json", ".txt", ".pdf") -and
            -not ($_.Name -like "OFL-*.txt" -and $_.Directory.Name -eq "fuentes")
          }) + @(Get-ChildItem dist -Recurse -File -Force | Where-Object {
            $_.Name -like ".env*" -or $_.Name -like "app_config-*"
          })
          if ($prohibidos) {
            Write-Host "[ERROR] El exe empaqueta ficheros que no debe:"
            $prohibidos | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }
          # Lo que la interfaz PyQt6 necesita para verse bien: tipografías, escudo,
          # novedades, icono de la ventana, el plugin de plataforma de Windows y la traducción de Qt.
          $necesarios = @(
            (Join-Path $int "src\recursos\fuentes\Barlow-Regular.ttf"),
            (Join-Path $int "src\recursos\fuentes\BarlowCondensed-ExtraBold.ttf"),
            (Join-Path $int "src\recursos\escudo.png"),
            (Join-Path $int "src\recursos\novedades.md"),
            (Join-Path $int "imagenes\icono.png"),
            (Join-Path $int "drivers\msedgedriver.exe")
          )
          $faltan = @($necesarios | Where-Object { -not (Test-Path $_) })
          if (-not (Get-ChildItem $int -Recurse -File -Filter "qwindows.dll")) { $faltan += "plugin qwindows.dll" }
          if (-not (Get-ChildItem $int -Recurse -File -Filter "qtbase_es.qm")) { $faltan += "traducción qtbase_es.qm" }
          if (Get-ChildItem $int -Recurse -Directory -Filter "tkinter") { Write-Host "[AVISO] Se ha colado tkinter en el exe" }
          if ($faltan) {
            Write-Host "[ERROR] Faltan en el exe:"
            $faltan | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          # El driver empaquetado tiene que funcionar: es el que se usa sin red.
          $driver = & (Join-Path $int "drivers\msedgedriver.exe") --version
          if ($LASTEXITCODE -ne 0 -or $driver -notmatch "\d+\.\d+\.\d+\.\d+") { Write-Host "[ERROR] El driver empaquetado no responde: $driver"; exit 1 }
          Write-Host "[OK] $driver"
          # El nombre que enseñan la barra de tareas y el Administrador de tareas es la
          # descripción del exe (recurso de versión del spec), no el nombre del archivo.
          $info = (Get-Item $env:EXE).VersionInfo
          if ($info.FileDescription -ne $env:NOMBRE -or $info.ProductName -ne $env:NOMBRE) {
            Write-Host "[ERROR] Descripción del exe: '$($info.FileDescription)', producto: '$($info.ProductName)'; tienen que ser '$env:NOMBRE'"
            exit 1
          }
          Write-Host "[OK] Descripción del exe: $($info.FileDescription) $($info.FileVersion)"
          Write-Host "[OK] Exe: $([math]::Round((Get-Item $env:EXE).Length / 1MB, 1)) MB; carpeta: $([math]::Round(((Get-ChildItem dist -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB, 1)) MB"

      # Que el exe exista no basta: se arranca en modo prueba (sin comprobar el
      # driver de Edge), tiene que llegar a la ventana principal y salir limpio.
      - name: Arrancar el exe hasta la ventana principal
        shell: pwsh
        run: |
          $log = Join-Path $env:APPDATA "AsistenteEPLA\logs\app.log"
          $marca = "PRUEBA DE ARRANQUE: ventana principal a la vista"
          $exe = (Resolve-Path $env:EXE).Path
          $env:ASISTENTE_PRUEBA_DE_ARRANQUE = "1"
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          $termino = $p.WaitForExit(120000)
          if (-not $termino) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          $codigo = if ($termino) { $p.ExitCode } else { $null }
          if (Test-Path $log) {
            Write-Host "=== app.log (últimas 60 líneas) ==="
            Get-Content $log -Encoding UTF8 | Select-Object -Last 60 | ForEach-Object { Write-Host $_ }
          } else {
            Write-Host "[ERROR] No se ha creado ${log}: el exe no llegó a ejecutar Python"
          }
          $llego = (Test-Path $log) -and [bool](Select-String -Path $log -SimpleMatch $marca -Quiet)
          if ($llego -and $termino -and $codigo -eq 0) { Write-Host "[OK] $marca y salida limpia"; exit 0 }
          Write-Host "[ERROR] El exe no llegó a la ventana principal (terminó=$termino, código=$codigo)"
          exit 1

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Generar el instalador
        shell: pwsh
        run: |
          $iscc = Get-ChildItem -Path "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { Write-Host "[ERROR] No se encuentra ISCC.exe"; exit 1 }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.numero }}" installer_setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem installer_output\*.exe | ForEach-Object {
            Write-Host "[OK] $($_.Name): $([math]::Round($_.Length / 1MB, 1)) MB"
          }

      - uses: actions/upload-artifact@v6
        with:
          name: Asistente_Documentacion_EPLA-Windows
          path: installer_output/*.exe
          if-no-files-found: error

  macos:
    name: DMG de macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pruebas
        env:
          PYTHONPATH: ${{ github.workspace }}
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v

      - name: Versión
        id: version
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/__init__.py | head -1)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "[ERROR] src/__init__.py dice $v y la etiqueta ${GITHUB_REF_NAME}"; exit 1
          fi
          echo "Versión: $v"
          echo "numero=$v" >> "$GITHUB_OUTPUT"

      - name: Bajar el msedgedriver de macOS
        run: python scripts/descargar_driver.py

      - name: Compilar el .app con PyInstaller
        run: pyinstaller Asistente_Documentacion_EPLA.spec --noconfirm --clean

      # La misma regla que en Windows: lo propio de la app (archivos sueltos de
      # MacOS, Frameworks y Resources, y las carpetas que copia el spec) solo puede
      # llevar código, imágenes y el driver; en todo el .app, ni .env ni la
      # configuración de otras variantes.
      - name: Comprobar que el .app existe y no lleva datos
        run: |
          set -euo pipefail
          C="$APP/Contents"
          [ -x "$C/MacOS/Asistente_Documentacion_EPLA" ] || { echo "[ERROR] No existe $C/MacOS/Asistente_Documentacion_EPLA"; exit 1; }
          propios=$( { find "$C/MacOS" "$C/Frameworks" "$C/Resources" -maxdepth 1 -type f
                       for d in config src imagenes drivers; do find -L "$C/Frameworks/$d" "$C/Resources/$d" -type f 2>/dev/null || true; done; } | sort -u)
          # La licencia OFL de las tipografías Barlow (src/recursos/fuentes) sí viaja con ellas.
          prohibidos=$(printf '%s\n' "$propios" | grep -Ei '\.(xlsx|xls|csv|db|sqlite|log|json|txt|pdf)$' | grep -Ev '/fuentes/OFL-[^/]*\.txt$' || true)
          prohibidos="$prohibidos$(find "$C" \( -name '.env*' -o -name 'app_config-*' \) -print)"
          if [ -n "$prohibidos" ]; then echo "[ERROR] El .app empaqueta ficheros que no debe:"; echo "$prohibidos"; exit 1; fi
          # Lo que la interfaz necesita para verse bien y el driver de Edge, en la ruta
          # que usa la app (sys._MEIPASS = Contents/Frameworks).
          faltan=""
          for f in src/recursos/fuentes/Barlow-Regular.ttf src/recursos/fuentes/BarlowCondensed-ExtraBold.ttf \
                   src/recursos/escudo.png src/recursos/novedades.md imagenes/icono.png drivers/msedgedriver; do
            [ -e "$C/Frameworks/$f" ] || faltan="$faltan $f"
          done
          [ -n "$(find "$C" -name libqcocoa.dylib -print -quit)" ] || faltan="$faltan plugin libqcocoa.dylib"
          [ -n "$(find "$C" -name qtbase_es.qm -print -quit)" ] || faltan="$faltan traducción qtbase_es.qm"
          if [ -n "$faltan" ]; then echo "[ERROR] Faltan en el .app:$faltan"; exit 1; fi
          # El icono del .app (Finder y Dock) es imagenes/icono.icns, el del repositorio.
          icono=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$C/Info.plist")
          cmp -s "$C/Resources/$icono" imagenes/icono.icns || { echo "[ERROR] El icono del .app ($icono) no es imagenes/icono.icns"; exit 1; }
          echo "[OK] Icono: $icono ($(shasum -a 256 imagenes/icono.icns | cut -c1-12))"
          # Nombre visible en Aplicaciones, el Dock, el Launchpad y el menú: sin «_».
          for clave in CFBundleName CFBundleDisplayName; do
            valor=$(/usr/libexec/PlistBuddy -c "Print :$clave" "$C/Info.plist")
            [ "$valor" = "$NOMBRE" ] || { echo "[ERROR] $clave es «$valor» y tiene que ser «$NOMBRE»"; exit 1; }
          done
          echo "[OK] Nombre del .app: $(basename "$APP") ($NOMBRE)"
          [ -z "$(find "$C" -type d -name tkinter -print -quit)" ] || echo "[AVISO] Se ha colado tkinter en el .app"
          # Solo Apple Silicon: el ejecutable y el driver, arm64 y nada de Intel (x86_64).
          for b in "$C/MacOS/Asistente_Documentacion_EPLA" "$C/Frameworks/drivers/msedgedriver"; do
            arqs=$(lipo -archs "$b")
            [ "$arqs" = "arm64" ] || { echo "[ERROR] $b tiene que ser solo arm64 y es: $arqs"; exit 1; }
          done
          echo "[OK] Arquitectura: arm64 (Apple Silicon)"
          # El driver empaquetado tiene que funcionar: es el que se usa sin red.
          driver=$("$C/Frameworks/drivers/msedgedriver" --version)
          echo "$driver" | grep -Eq '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' || { echo "[ERROR] El driver empaquetado no responde: $driver"; exit 1; }
          echo "[OK] $driver"
          echo "[OK] .app: $(du -sh "$APP" | cut -f1)"

      # Que el .app exista no basta: se arranca en modo prueba (sin comprobar el
      # driver de Edge), tiene que llegar a la ventana principal y salir limpio.
      - name: Arrancar el .app hasta la ventana principal
        run: |
          set +e
          LOG="$HOME/Library/Application Support/AsistenteEPLA/logs/app.log"
          MARCA="PRUEBA DE ARRANQUE: ventana principal a la vista"
          # Sin `timeout` en macOS: perl corta a los 120 s.
          ASISTENTE_PRUEBA_DE_ARRANQUE=1 QT_QPA_PLATFORM=offscreen \
            perl -e 'alarm 120; exec { $ARGV[0] } @ARGV' "$APP/Contents/MacOS/Asistente_Documentacion_EPLA"
          codigo=$?
          if [ -f "$LOG" ]; then
            echo "=== app.log (últimas 60 líneas) ==="; tail -n 60 "$LOG"
          else
            echo "[ERROR] No se ha creado $LOG: el .app no llegó a ejecutar Python"
          fi
          if [ "$codigo" -eq 0 ] && grep -qF "$MARCA" "$LOG" 2>/dev/null; then echo "[OK] $MARCA y salida limpia"; exit 0; fi
          echo "[ERROR] El .app no llegó a la ventana principal (código=$codigo)"
          exit 1

      - name: Generar el DMG
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.numero }}"
          DMG="Asistente_Documentacion_EPLA_${v}_macOS.dmg"
          mkdir -p dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          # hdiutil falla a veces en los ejecutores con «Resource busy»: hasta tres intentos.
          for intento in 1 2 3; do
            hdiutil create -volname "$NOMBRE" -srcfolder dmg -ov -format UDZO "$DMG" && break
            [ "$intento" -lt 3 ] || exit 1
            sleep 10
          done
          echo "[OK] $DMG: $(du -h "$DMG" | cut -f1)"

      - uses: actions/upload-artifact@v6
        with:
          name: Asistente_Documentacion_EPLA-macOS
          path: "*.dmg"
          if-no-files-found: error

  publicar:
    name: Adjuntar al release
    needs: [windows, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: instaladores

      - name: Adjuntar al release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          etiqueta="${GITHUB_REF_NAME}"
          archivos=$(find instaladores -type f \( -name '*.exe' -o -name '*.dmg' \))
          echo "$archivos"
          # Una etiqueta con guion (v3.4.0-beta) se publica como versión previa.
          previa=""
          case "$etiqueta" in *-*) previa="--prerelease" ;; esac
          if gh release view "$etiqueta" >/dev/null 2>&1; then
            gh release upload "$etiqueta" $archivos --clobber
          else
            gh release create "$etiqueta" $archivos \
              --title "$NOMBRE ${etiqueta#v}" --generate-notes $previa
          fi
